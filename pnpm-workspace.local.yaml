# =============================================================================
# EduBot - Local Development Workspace Config (Windows/Mac/Linux)
# =============================================================================
# This is the LOCAL-DEV version of pnpm-workspace.yaml.
#
# The original pnpm-workspace.yaml has platform overrides that remove all
# non-linux-x64 binaries (because Replit runs on Linux only). On Windows or
# Mac, those overrides break esbuild, lightningcss, rollup, etc.
#
# To use this file on your local machine:
#   Windows:  copy pnpm-workspace.local.yaml pnpm-workspace.yaml
#   Linux/Mac: cp pnpm-workspace.local.yaml pnpm-workspace.yaml
#
# Then run: pnpm install
# =============================================================================

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# NO platform overrides — install all binaries for your local OS

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
